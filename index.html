nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--soft);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:560px;margin:auto}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--deep)}
nav button.on span{filter:none;opacity:1}
.fab{position:fixed;z-index:6;right:max(20px,calc(50% - 260px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:var(--deep);color:var(--on);font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(57,88,134,.4)}
.gh{font-size:14px;font-weight:700;color:var(--mut);padding:16px 22px 8px}
.c{display:flex;gap:12px;align-items:center;margin:0 16px 10px;padding:14px;border:0;border-radius:20px;background:var(--card);box-shadow:0 1px 3px rgba(57,88,134,.1);text-align:left}
button.c{width:calc(100% - 32px)}
.c.past{opacity:.55}
.c.next{background:var(--deep);color:var(--on)}
.c.next .m{color:inherit;opacity:.8}
.c.next .bd{background:rgba(255,255,255,.2);color:inherit}
.ic{flex:none;width:46px;height:46px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:23px}
.c.next .ic{background:rgba(255,255,255,.2)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{flex:none;border:0;border-radius:99px;padding:5px 11px;background:var(--soft);color:var(--deep);font-size:12px;font-weight:700;white-space:nowrap}
.bd.act{background:var(--deep);color:var(--on)}
.x{border:0;background:none;color:var(--mut);font-size:16px;padding:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--soft);color:var(--deep);font-size:14px;font-weight:600}
.chip.on{background:var(--deep);color:var(--on)}
.em{text-align:center;padding:60px 30px;color:var(--mut)}
.em div{font-size:44px}
.em b{display:block;color:var(--ink);margin-top:8px}
.em p{margin:4px 0 0}
.cal{margin:6px 16px;padding:12px;background:var(--card);border-radius:22px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px}
.ch button{border:0;background:var(--soft);color:var(--deep);width:34px;height:34px;border-radius:50%;font-size:20px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wk{font-size:12px;font-weight:700;color:var(--mut);padding:4px 0}
.d{position:relative;aspect-ratio:1;border:0;background:none;border-radius:14px;font-size:15px}
.d.t{font-weight:800;color:var(--blue)}
.d.s{background:var(--deep);color:var(--on)}
.d i{position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--blue)}
.d.s i{background:var(--on)}
.ib{padding:8px 16px 10px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.mi{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:20px;overflow:hidden;background:var(--soft)}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi span{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;text-align:left;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(transparent,rgba(34,56,90,.85))}
.mi small{font-weight:500;opacity:.85}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(34,56,90,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#ov.o{opacity:1;pointer-events:auto}
#sh{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#ov.o #sh{transform:none}
#sh:before{content:"";display:block;width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:var(--tint)}
#sh h2{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
label{display:block;margin:14px 0 5px;font-size:13px;font-weight:700;color:var(--mut)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--soft);border-radius:14px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0}
.r{display:flex;gap:10px}
.r>*{flex:1;min-width:0}
.pb,.sb{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;font-size:16px;font-weight:700;background:var(--deep);color:var(--on)}
.sb{background:var(--soft);color:var(--deep);margin-top:10px}
.db{color:#c0392b}
.pb:disabled{opacity:.5}
.dh{text-align:center;padding:6px 0 10px}
.dh .ic{margin:0 auto 8px;width:60px;height:60px;font-size:30px;border-radius:20px}
#ph img{width:100%;border-radius:20px;display:block;margin:6px 0 10px}
.kv{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.kv span{flex:none;width:24px;text-align:center}
.lg{min-height:100vh;display:grid;place-items:center;padding:24px}
.lg form{width:100%;max-width:360px;text-align:center}
.lg h1{font-size:38px;font-weight:800;letter-spacing:-.8px}
.lg input{margin-top:10px}
.logo{font-size:56px}
.err{color:#c0392b;min-height:20px;font-size:14px;margin:8px 0 0}
#to{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,20px);max-width:90%;padding:10px 18px;border-radius:99px;background:var(--deep);color:var(--on);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#to.o{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login" class="lg" hidden>
  <form id="lf">
    <div class="logo">💙</div>
    <h1>Together</h1>
    <p class="m">Just for the two of us</p>
    <input name="e" type="email" required autocomplete="username" placeholder="Email">
    <input name="p" type="password" required autocomplete="current-password" placeholder="Password">
    <p id="le" class="err"></p>
    <button class="pb">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><h1 id="h"></h1><button class="gear" data-a="set" aria-label="Settings">⚙️</button></header>
  <main id="main"></main>
  <button class="fab" data-a="add" aria-label="Add">+</button>
  <nav><div>
    <button data-a="tab" data-id="t"><span>🕒</span>Timeline</button>
    <button data-a="tab" data-id="c"><span>📅</span>Calendar</button>
    <button data-a="tab" data-id="i"><span>💡</span>Ideas</button>
    <button data-a="tab" data-id="m"><span>🖼️</span>Moments</button>
  </div></nav>
</div>

<div id="ov"><div id="sh"></div></div>
<input type="file" id="pf" accept="image/*" hidden>
<div id="to"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: paste your own values ===== */
const SB_URL='https://bwtczsxvvyilzoaemkcy.supabase.co', SB_KEY='sb_publishable_h77812kuq0eyV6ys74c5GQ_OSrpWVis', VAPID='BD5FZECfntsQXfsLrQxuxIFx_FDMBZ9wmptBjMAoUIqhn9aNMgYReeps56DdcFbIRo2yJIbNSNAnxXvTWaf3ikY';

const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS={dinner:['🍽️','Dinner'],movie:['🎬','Movie'],monthsary:['💙','Monthsary'],anniversary:['🥂','Anniversary'],trip:['✈️','Trip'],birthday:['🎂','Birthday'],surprise:['🎁','Surprise'],other:['✨','Other']};
const S={tab:'t',cat:'all',dates:[],ideas:[],urls:{},ut:Date.now(),cid:null,uid:null,cur:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const diff=s=>Math.round((P(s)-P(ymd(new Date())))/864e5);
const fd=s=>P(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const ft=t=>{if(!t)return'';const[h,m]=t.split(':');return`${+h%12||12}:${m} ${+h<12?'AM':'PM'}`};
const peso=n=>'₱'+Number(n).toLocaleString('en-PH',{maximumFractionDigits:2});
const cd=s=>{const n=diff(s);return n===0?'Today':n===1?'Tomorrow':n>1?`in ${n} days`:n===-1?'Yesterday':`${-n} days ago`};
const cmp=(a,b)=>a.date_on.localeCompare(b.date_on)||(a.time_at||'').localeCompare(b.time_at||'');
const who=()=>localStorage.getItem('who')||null;
const catOpts=sel=>Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v[0]} ${v[1]}</option>`).join('');
const now=new Date();
S.mo=new Date(now.getFullYear(),now.getMonth(),1);
S.sel=ymd(now);

let TT;
function toast(m){const t=$('#to');t.textContent=m;t.classList.add('o');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('o'),2800)}
const open=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('o')};
const close=()=>{$('#ov').classList.remove('o');S.cur=null};
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
const show=w=>{$('#login').hidden=w!=='login';$('#app').hidden=w!=='app'};

/* ---------- data ---------- */
async function load(){
  const[a,b]=await Promise.all([
    sb.from('dates').select('*').order('date_on'),
    sb.from('ideas').select('*').eq('done',false).order('created_at',{ascending:false})
  ]);
  if(a.error||b.error){toast("Couldn't load. Check your connection.");return}
  S.dates=a.data||[];S.ideas=b.data||[];render();
}

async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(SB_URL.startsWith('YOUR')){show('login');$('#le').textContent='Add your Supabase URL and key in index.html first.';return}
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return show('login');
  S.uid=session.user.id;
  const{data:m}=await sb.from('couple_members').select('couple_id').limit(1).maybeSingle();
  if(!m){await sb.auth.signOut();show('login');$('#le').textContent="This login isn't linked to your couple yet. Run the last block of the SQL setup.";return}
  S.cid=m.couple_id;show('app');
  await load();
  sb.channel('live')
    .on('postgres_changes',{event:'*',schema:'public',table:'dates'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'ideas'},load)
    .subscribe();
  if(!who())settings();
}

$('#lf').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);$('#le').textContent='';
  const{error}=await sb.auth.signInWithPassword({email:f.get('e').trim(),password:f.get('p')});
  if(error)return $('#le').textContent=error.message;
  boot();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.cid)load()});

/* ---------- views ---------- */
function render(){
  $('#h').textContent={t:'Timeline',c:'Calendar',i:'Ideas',m:'Moments'}[S.tab];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===S.tab));
  $('.fab').hidden=S.tab==='m';
  $('#main').innerHTML={t:vT,c:vC,i:vI,m:vM}[S.tab]();
  if(S.tab==='m')signed();
}
const empty=(t,s)=>`<div class="em"><div>💙</div><b>${t}</b><p>${s}</p></div>`;
const card=(d,cls='')=>`<button class="c ${cls}" data-a="det" data-id="${d.id}"><span class="ic">${CATS[d.category][0]}</span><span class="tx"><b>${esc(d.title)}</b><small class="m">${fd(d.date_on)}${d.time_at?' at '+ft(d.time_at):''}</small>${d.place?`<small class="m">${esc(d.place)}</small>`:''}</span><span class="bd">${cd(d.date_on)}</span></button>`;
const grp=s=>{const n=diff(s);return n===0?'Today':n<=7?'This week':P(s).toLocaleDateString('en-US',{month:'long',year:'numeric'})};

function vT(){
  const chips=`<div class="chips">${[['all','All'],...Object.entries(CATS).map(([k,v])=>[k,v[0]+' '+v[1]])].map(([k,l])=>`<button class="chip${S.cat===k?' on':''}" data-a="cat" data-id="${k}">${l}</button>`).join('')}</div>`;
  const l=S.dates.filter(d=>S.cat==='all'||d.category===S.cat);
  const up=l.filter(d=>diff(d.date_on)>=0).sort(cmp),past=l.filter(d=>diff(d.date_on)<0).sort((a,b)=>cmp(b,a));
  if(!up.length&&!past.length)return chips+empty('No dates yet','Tap + to plan your first one.');
  let h=chips,last='';
  up.forEach((d,i)=>{const g=grp(d.date_on);if(g!==last){h+=`<div class="gh">${g}</div>`;last=g}h+=card(d,i===0?'next':'')});
  if(past.length){h+='<div class="gh">Past</div>';past.forEach(d=>h+=card(d,'past'))}
  return h;
}

function vC(){
  const y=S.mo.getFullYear(),m=S.mo.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=ymd(new Date());
  const has={};S.dates.forEach(d=>has[d.date_on]=1);
  let g=['S','M','T','W','T','F','S'].map(x=>`<div class="wk">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=n;i++){const s=`${y}-${pad(m+1)}-${pad(i)}`;g+=`<button class="d${s===td?' t':''}${s===S.sel?' s':''}" data-a="day" data-id="${s}">${i}${has[s]?'<i></i>':''}</button>`}
  const day=S.dates.filter(d=>d.date_on===S.sel).sort(cmp);
  return `<div class="cal"><div class="ch"><button data-a="mo" data-id="-1" aria-label="Previous month">‹</button><b>${S.mo.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button data-a="mo" data-id="1" aria-label="Next month">›</button></div><div class="g">${g}</div></div>`
   +`<div class="gh">${fd(S.sel)}</div>`
   +(day.length?day.map(d=>card(d,diff(d.date_on)<0?'past':'')).join(''):'<p class="m" style="padding:0 22px">Nothing planned. Tap + to add a date.</p>');
}

function vI(){
  let h='<div class="ib"><button class="pb" style="margin-top:6px" data-a="sur">🎲 Surprise us</button></div>';
  if(!S.ideas.length)return h+empty('No ideas yet','Tap + to save places and things you want to try together.');
  S.ideas.forEach(i=>{
    const sub=[i.place?esc(i.place):'',i.est_cost!=null?peso(i.est_cost):''].filter(Boolean).join(' · ')||CATS[i.category][1];
    h+=`<div class="c"><span class="ic">${CATS[i.category][0]}</span><span class="tx"><b>${esc(i.title)}</b><small class="m">${sub}</small></span><button class="bd act" data-a="sched" data-id="${i.id}">Schedule</button><button class="x" data-a="idel" data-id="${i.id}" aria-label="Delete idea">✕</button></div>`;
  });
  return h;
}

function vM(){
  const l=S.dates.filter(d=>d.photo_path).sort((a,b)=>b.date_on.localeCompare(a.date_on));
  if(!l.length)return empty('No moments yet','Open a date and add its best photo.');
  return `<div class="mg">${l.map(d=>`<button class="mi" data-a="det" data-id="${d.id}">${S.urls[d.photo_path]?`<img src="${S.urls[d.photo_path]}" alt="${esc(d.title)}">`:''}<span>${esc(d.title)}<br><small>${fd(d.date_on)}</small></span></button>`).join('')}</div>`;
}

/* ---------- photos ---------- */
const stale=()=>{if(Date.now()-S.ut>3e6){S.urls={};S.ut=Date.now()}};
async function signed(){
  stale();
  const need=[...new Set(S.dates.map(d=>d.photo_path).filter(p=>p&&!S.urls[p]))];
  if(!need.length)return;
  const{data}=await sb.storage.from('moments').createSignedUrls(need,3600);
  let add=0;(data||[]).forEach(r=>{if(r.signedUrl){S.urls[r.path]=r.signedUrl;add++}});
  if(add&&S.tab==='m')render();
}
async function url(p){
  stale();
  if(!S.urls[p]){const{data}=await sb.storage.from('moments').createSignedUrl(p,3600);if(data)S.urls[p]=data.signedUrl}
  return S.urls[p];
}
const shrink=f=>new Promise((ok,no)=>{
  const i=new Image(),u=URL.createObjectURL(f);
  i.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):no(Error('Could not compress image')),'image/jpeg',.82)};
  i.onerror=()=>no(Error('Unsupported image'));i.src=u;
});
$('#pf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  const d=S.dates.find(x=>x.id===S.cur);if(!f||!d)return;
  try{
    toast('Uploading photo…');
    const path=`${S.cid}/${d.id}.jpg`;
    const up=await sb.storage.from('moments').upload(path,await shrink(f),{contentType:'image/jpeg',upsert:true});
    if(up.error)throw up.error;
    const u=await sb.from('dates').update({photo_path:path}).eq('id',d.id);
    if(u.error)throw u.error;
    delete S.urls[path];await load();det(d.id);toast('Photo saved');
  }catch(x){toast('Upload failed: '+x.message)}
};

/* ---------- sheets ---------- */
async function det(id){
  const d=S.dates.find(x=>x.id===id);if(!d)return;
  S.cur=id;
  open(`<div class="dh"><div class="ic">${CATS[d.category][0]}</div><h2>${esc(d.title)}</h2><p class="m">${CATS[d.category][1]}${d.recurrence!=='none'?', repeats '+d.recurrence:''}</p></div>
  <div id="ph"></div>
  <div class="kv"><span>📅</span><div>${fd(d.date_on)}, <b>${cd(d.date_on)}</b></div></div>
  ${d.time_at?`<div class="kv"><span>🕒</span><div>${ft(d.time_at)}</div></div>`:''}
  ${d.place?`<div class="kv"><span>📍</span><div>${esc(d.place)}</div></div>`:''}
  ${d.budget!=null?`<div class="kv"><span>💰</span><div>${peso(d.budget)}</div></div>`:''}
  ${d.notes?`<div class="kv"><span>📝</span><div>${esc(d.notes)}</div></div>`:''}
  ${d.added_by?`<p class="m">Added by ${esc(d.added_by)}</p>`:''}
  <button class="sb" data-a="photo">${d.photo_path?'Replace photo':'📷 Add best photo'}</button>
  ${d.photo_path?'<button class="sb" data-a="rmph">Remove photo</button>':''}
  <div class="r"><button class="sb" data-a="edit">Edit</button><button class="sb db" data-a="del">Delete</button></div>`);
  if(d.photo_path){const u=await url(d.photo_path);if(u&&S.cur===id&&$('#ph'))$('#ph').innerHTML=`<img src="${u}" alt="">`}
}

function form(d={}){
  open(`<h2>${d.id?'Edit date':'New date'}</h2>
  <form id="df">
  <label>Title</label><input name="title" required maxlength="80" placeholder="Dinner at our spot" value="${esc(d.title)}">
  <div class="r"><div><label>Date</label><input type="date" name="date_on" required value="${d.date_on||''}"></div>
  <div><label>Time</label><input type="time" name="time_at" value="${(d.time_at||'').slice(0,5)}"></div></div>
  <label>Category</label><select name="category">${catOpts(d.category||'dinner')}</select>
  <label>Place</label><input name="place" maxlength="80" value="${esc(d.place)}">
  <div class="r"><div><label>Budget (₱)</label><input type="number" name="budget" min="0" step="0.01" inputmode="decimal" value="${d.budget??''}"></div>
  <div><label>Repeats</label><select name="recurrence">${[['none','Never'],['monthly','Monthly'],['yearly','Yearly']].map(([k,l])=>`<option value="${k}"${k===(d.recurrence||'none')?' selected':''}>${l}</option>`).join('')}</select></div></div>
  <label>Notes</label><textarea name="notes" rows="3" maxlength="500">${esc(d.notes)}</textarea>
  <button class="pb">Save date</button></form>`);
  $('#df').onsubmit=async e=>{
    e.preventDefault();const r=Object.fromEntries(new FormData(e.target)),btn=$('#df .pb');
    const row={title:r.title.trim(),date_on:r.date_on,time_at:r.time_at||null,category:r.category,place:r.place.trim()||null,budget:r.budget===''?null:+r.budget,recurrence:r.recurrence,notes:r.notes.trim()||null};
    if(!row.title)return;
    btn.disabled=true;
    const{error}=d.id?await sb.from('dates').update(row).eq('id',d.id):await sb.from('dates').insert({...row,couple_id:S.cid,added_by:who()});
    if(error){btn.disabled=false;return toast(error.message)}
    if(d.idea)await sb.from('ideas').update({done:true}).eq('id',d.idea);
    close();await load();toast('Date saved');
  };
}

function iform(){
  open(`<h2>New idea</h2><form id="if">
  <label>Idea</label><input name="title" required maxlength="80" placeholder="Try the new ramen place">
  <label>Category</label><select name="category">${catOpts('dinner')}</select>
  <label>Place</label><input name="place" maxlength="80">
  <label>Estimated cost (₱)</label><input type="number" name="est_cost" min="0" step="0.01" inputmode="decimal">
  <button class="pb">Save idea</button></form>`);
  $('#if').onsubmit=async e=>{
    e.preventDefault();const r=Object.fromEntries(new FormData(e.target)),btn=$('#if .pb');
    if(!r.title.trim())return;btn.disabled=true;
    const{error}=await sb.from('ideas').insert({couple_id:S.cid,title:r.title.trim(),category:r.category,place:r.place.trim()||null,est_cost:r.est_cost===''?null:+r.est_cost,added_by:who()});
    if(error){btn.disabled=false;return toast(error.message)}
    close();await load();toast('Idea saved');
  };
}

function sur(){
  open(`<h2>🎲 Surprise us</h2><p class="m">Picks a random idea from your list.</p>
  <div class="r"><div><label>Category</label><select id="sc"><option value="all">Any</option>${catOpts('')}</select></div>
  <div><label>Max budget (₱)</label><input id="sm" type="number" min="0" inputmode="decimal" placeholder="Any"></div></div>
  <div id="sr"></div><button class="pb" data-a="pick">Pick one</button>`);
}
function pick(){
  const c=$('#sc').value,m=$('#sm').value;
  const l=S.ideas.filter(i=>(c==='all'||i.category===c)&&(m===''||i.est_cost==null||i.est_cost<=+m));
  if(!l.length){$('#sr').innerHTML='<p class="m" style="margin-top:14px">No ideas match. Try a different category or budget.</p>';return}
  const i=l[Math.floor(Math.random()*l.length)];
  $('#sr').innerHTML=`<div class="c" style="margin:16px 0 0"><span class="ic">${CATS[i.category][0]}</span><span class="tx"><b style="white-space:normal">${esc(i.title)}</b><small class="m">${[i.place?esc(i.place):'',i.est_cost!=null?peso(i.est_cost):''].filter(Boolean).join(' · ')||CATS[i.category][1]}</small></span></div><button class="sb" data-a="sched" data-id="${i.id}">Schedule it</button>`;
}

function settings(){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  open(`<h2>Settings</h2>
  <label>Your name (shown as “Added by”)</label><input id="nm" maxlength="30" value="${esc(who())}">
  <button class="pb" data-a="savenm">Save name</button>
  <label>Reminders on this phone</label>
  <p class="m" style="margin:0">${ios&&!sa?'On iPhone: tap Share, then Add to Home Screen. Open Together from your Home Screen and turn reminders on there.':'You get a notice the day before and at 8:00 AM on the day.'}</p>
  <button class="sb" data-a="push">🔔 Turn on reminders</button>
  <button class="sb db" data-a="out">Sign out</button>`);
}

const b64=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function push(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return toast('Not supported here. On iPhone, add to Home Screen first.');
    if(VAPID.startsWith('YOUR'))return toast('Add your VAPID public key in index.html');
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast('Notifications are blocked in your phone settings');
    const reg=await navigator.serviceWorker.ready;
    const s=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const j=s.toJSON();
    const{error}=await sb.from('push_subscriptions').upsert({couple_id:S.cid,user_id:S.uid,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,device_label:`${who()||''} ${navigator.platform}`.trim()},{onConflict:'endpoint'});
    if(error)throw error;
    toast('Reminders are on 🔔');
  }catch(x){toast('Could not turn on: '+x.message)}
}

/* ---------- actions ---------- */
const A={
  tab:id=>{S.tab=id;render();scrollTo(0,0)},
  cat:id=>{S.cat=id;render()},
  day:id=>{S.sel=id;render()},
  mo:id=>{S.mo=new Date(S.mo.getFullYear(),S.mo.getMonth()+(+id),1);render()},
  det,
  add:()=>S.tab==='i'?iform():form({date_on:S.tab==='c'?S.sel:ymd(new Date())}),
  edit:()=>{const d=S.dates.find(x=>x.id===S.cur);if(d)form(d)},
  photo:()=>$('#pf').click(),
  rmph:async()=>{
    const d=S.dates.find(x=>x.id===S.cur);if(!d||!confirm('Remove this photo?'))return;
    await sb.storage.from('moments').remove([d.photo_path]);
    const{error}=await sb.from('dates').update({photo_path:null}).eq('id',d.id);
    if(error)return toast(error.message);
    delete S.urls[d.photo_path];await load();det(d.id);
  },
  del:async()=>{
    const d=S.dates.find(x=>x.id===S.cur);if(!d||!confirm('Delete this date?'))return;
    if(d.photo_path)await sb.storage.from('moments').remove([d.photo_path]);
    const{error}=await sb.from('dates').delete().eq('id',d.id);
    if(error)return toast(error.message);
    close();load();
  },
  sched:id=>{const i=S.ideas.find(x=>x.id===id);if(i)form({title:i.title,category:i.category,place:i.place,budget:i.est_cost,idea:i.id,date_on:ymd(new Date(Date.now()+864e5))})},
  idel:async id=>{if(!confirm('Delete this idea?'))return;const{error}=await sb.from('ideas').delete().eq('id',id);if(error)return toast(error.message);load()},
  sur,pick,push,
  set:settings,
  savenm:()=>{localStorage.setItem('who',$('#nm').value.trim());close();toast('Name saved')},
  out:async()=>{await sb.auth.signOut();location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id)});

boot();
</script>
